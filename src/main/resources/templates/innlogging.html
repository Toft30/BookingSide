<!DOCTYPE html>
<html lang="nn" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logg inn – Grupperom</title>
    <link rel="stylesheet" th:href="@{/css/stil.css}">
</head>
<body>
<main class="kort">
    <h1>Logg inn</h1>

    <!-- Flash-attributt frå redirect (t.d. etter registrering eller utlogging) -->
    <p class="ok" th:if="${melding}" th:text="${melding}"></p>
    <p class="feilmelding" th:if="${feilmelding}" th:text="${feilmelding}"></p>

    <!-- ${param.x} les query-parametrar: /login?krevInnlogging blir sett av interceptoren -->
    <p class="info" th:if="${param.krevInnlogging}">Du må logge inn for å sjå denne sida.</p>

    <form th:action="@{/login}" method="post">
        <label for="epost">E-post</label>
        <input type="email" id="epost" name="epost" th:value="${epost}" required>

        <label for="passord">Passord</label>
        <input type="password" id="passord" name="passord" required>

        <button type="submit">Logg inn</button>
    </form>

    <p>Ny her? <a th:href="@{/registrer}">Registrer deg</a></p>
</main>
</body>
</html>
