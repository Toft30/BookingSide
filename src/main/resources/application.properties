spring.application.name=grupperom-booking

# --- Database ---
# Fil-basert H2: data blir lagra i ./data/bookingdb.mv.db og overlever omstart.
spring.datasource.url=jdbc:h2:file:./data/bookingdb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate lagar/oppdaterer tabellane ut frå entitetsklassene.
# "update" endrar skjemaet utan å slette data (greitt for eit læringsprosjekt,
# men i produksjon ville ein brukt migreringsverktøy som Flyway).
spring.jpa.hibernate.ddl-auto=update

# Vis SQL i konsollen, nyttig for å sjå kva Spring Data genererer
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2-konsoll på http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/bookingdb, brukar: sa, tomt passord)
spring.h2.console.enabled=true
